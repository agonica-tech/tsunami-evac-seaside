<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Seaside Oregon Tsunami Evacuation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet"/>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoiam9zaHVhd2VpbGwiLCJhIjoiY21ubzg5dXF2MjE4NDJ3b2FkdDd3NXQ1YiJ9.9f8C-kRIsyAMjKateu0tDA';
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [-123.9229, 45.9934],
  zoom: 13
});

map.on('load', () => {

  map.addSource('inundation', {
    type: 'geojson',
    data: 'data/DOGAMI_Tsunami_inundation_2.geojson'
  });

  map.addLayer({
    id: 'inundation-fill',
    type: 'fill',
    source: 'inundation',
    paint: {
      'fill-color': '#E24B4A',
      'fill-opacity': 0.4
    }
  });

  map.addLayer({
    id: 'inundation-outline',
    type: 'line',
    source: 'inundation',
    paint: {
      'line-color': '#A32D2D',
      'line-width': 2
    }
  });

});
  </script>
</body>
</html>
